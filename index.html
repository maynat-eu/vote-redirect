<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MAYNAT.EU · Votează</title>

    <link rel="icon" type="image/png" href="https://www.maynat.eu/images/logo.png" />

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0b0f14;
            color: #e6edf3;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 24px;
        }

        .box {
            text-align: center;
            max-width: 420px;
            width: 100%;
        }

        .logo {
            width: 80px;
            height: 80px;
            object-fit: contain;
            margin-bottom: 24px;
            opacity: 0.9;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 10px;
            letter-spacing: -0.5px;
        }

        p {
            font-size: 0.95rem;
            color: #8b96a5;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .btn {
            display: inline-block;
            background: #1f6feb;
            color: #fff;
            text-decoration: none;
            padding: 13px 32px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 600;
            transition: background 0.15s ease;
        }

        .btn:hover {
            background: #2a7fff;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid #1f2a37;
            border-top-color: #1f6feb;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>

    <script>
        window.location.replace('https://minecraft-mp.com/server/362361/vote/');
    </script>
</head>
<body>

    <div class="box">
        <div class="spinner"></div>
        <img src="https://www.maynat.eu/images/logo.png" alt="MAYNAT" class="logo" />
        <h1>Te redirecționăm...</h1>
        <p>Dacă nu ai fost trimis unde trebuie, apasă butonul de mai jos.</p>
        <a href="https://minecraft-mp.com/server/362361/vote/" class="btn">Votează acum</a>
    </div>

</body>
</html>
